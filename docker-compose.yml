services:
  db:
    image: postgres:16-alpine
    container_name: onibusexpress-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: onibusexpress
      POSTGRES_USER: onibusexpress
      POSTGRES_PASSWORD: onibusexpress
    ports:
      - "5432:5432"
    volumes:
      - onibusexpress-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onibusexpress -d onibusexpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/OniBusExpress.Api/Dockerfile
    container_name: onibusexpress-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=onibusexpress;Username=onibusexpress;Password=onibusexpress"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        # O navegador do usuário chama a API pela porta publicada no host, não pelo
        # nome de serviço interno do Docker ("api") — por isso localhost, não http://api:8080.
        VITE_API_URL: http://localhost:8080
    container_name: onibusexpress-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  onibusexpress-db-data:
